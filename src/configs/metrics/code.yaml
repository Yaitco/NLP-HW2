train: []
inference: []
generation:
  - _target_: src.metrics.CodePassRate
    tokenizer_path: ${data.tokenizer_path}
    code_format: ${oc.select:data.code_format,full}
    rtol: 1.0e-5
    atol: 1.0e-6
    timeout: 2.0 # Per program, including Python startup/imports; parent wall clock.
    memory_mb: 512
    workers: 4
    sandbox: ${oc.select:code_execution.sandbox,true}
